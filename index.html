<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Доска объявлений</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <h1 class="logo">📢 Доска объявлений</h1>
      <button class="btn btn--light" id="refreshBtn" type="button">Обновить</button>
    </div>
  </header>

  <main class="container layout">

    <!-- Форма отправки объявления -->
    <section class="card form-card">
      <h2 class="card__title">Подать объявление</h2>

      <form id="adForm" novalidate>
        <label class="field">
          <span class="field__label">Заголовок</span>
          <input type="text" id="title" name="title" placeholder="Например: Продаю ноутбук" required>
        </label>

        <label class="field">
          <span class="field__label">Описание</span>
          <textarea id="description" name="description" rows="4" placeholder="Состояние, комплектация..." required></textarea>
        </label>

        <label class="field">
          <span class="field__label">Цена</span>
          <input type="number" id="price" name="price" min="0" step="0.01" placeholder="30000" required>
        </label>

        <label class="field">
          <span class="field__label">Изображение</span>
          <input type="file" id="image" name="image" accept="image/*" required>
        </label>

        <img id="preview" class="preview" alt="" hidden>

        <button class="btn" type="submit" id="submitBtn">Отправить</button>
        <p class="message" id="formMessage" role="status"></p>
      </form>
    </section>

    <!-- Список объявлений -->
    <section class="list-section">
      <h2 class="section-title">
        Объявления <span class="badge" id="totalBadge">0</span>
      </h2>

      <p class="message" id="listMessage" role="status"></p>
      <div class="ads" id="adsList"></div>
    </section>

  </main>

  <footer class="footer">
    <div class="container">Доска объявлений · Мади, группа WIN-1-25💖</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
